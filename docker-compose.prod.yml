version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-comedor}
      POSTGRES_USER: ${POSTGRES_USER:-comedor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - comedor_internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comedor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    networks:
      - comedor_internal
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      SIFEN_HABILITADO: ${SIFEN_HABILITADO:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - comedor_internal
      - comedor_public
    restart: unless-stopped

  web-admin:
    build:
      context: ./apps/web-admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${API_URL:-/api}
    networks:
      - comedor_public
    restart: unless-stopped

  web-cliente:
    build:
      context: ./apps/web-cliente
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${API_URL:-/api}
    networks:
      - comedor_public
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web-admin
      - web-cliente
    networks:
      - comedor_public
    restart: unless-stopped

networks:
  comedor_internal:
    internal: true
  comedor_public:

volumes:
  postgres_data:
