upstream api {
    server api:3001;
}

upstream web_admin {
    server web-admin:80;
}

upstream web_cliente {
    server web-cliente:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # Admin panel
    location / {
        proxy_pass http://web_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API
    location /api {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Health check
    location /health {
        proxy_pass http://api;
    }

    # Portal cliente en subdominio /cliente
    location /cliente {
        proxy_pass http://web_cliente;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
